openapi: 3.1.0
info:
  title: MaxAPI
  version: 4.0.0
  description: |-
    maxapi holds logins into MAX Messenger accounts and exposes them over REST:
    sending text and media, reading history, contacts and groups, and webhook
    events. The owner logs in by scanning a QR code in the MAX app. When MAX
    answers a send with a limit or restriction error, the gateway pauses
    sending from that MAX account until the owner resumes it.

    This schema describes maxapi 1.5.0. `API.md` in the repository is the full
    contract; where the two disagree, the code is right.

    ## Authentication
    - **Admin endpoints** (`/admin/*`): header `Authorization` with the raw admin
      token (`MAXAPI_ADMIN_TOKEN` or `-admintoken`), without `Bearer`.
    - **Account endpoints** (`/session/*`, `/chat/*`, `/user/*`, `/group/*`,
      `/webhook`): header `token` with the account token returned by
      `POST /admin/users`. A `?token=` query parameter is accepted too when the
      header is absent.
    - `/health` takes no authentication.

    A missing or unknown token answers `401` `{"success": false, "error": "unauthorized"}`
    without `code`; on an account call it means the account was deleted
    (`DELETE /admin/users/{userid}`, `POST /session/logout` or `LoggedOut`).

    ## Errors
    Every error body is `ErrorResponse` (`success` false, `error`). Only
    `POST /chat/send/text`, `POST /session/resume` and
    `GET /admin/users/{userid}` add a machine `code`; elsewhere tell errors apart
    by the HTTP status and never by `error`. A required body that is missing or
    not JSON answers `400`.

    ## Webhooks
    Events go to the account's webhook (see `webhooks` below) as JSON when the
    gateway runs with `WEBHOOK_FORMAT=json`, otherwise as a form
    (`application/x-www-form-urlencoded`) with the same fields and nested
    values JSON-encoded. The same body also goes to the global webhook
    (`-globalwebhook`) and to RabbitMQ (plus `serverHost`) when configured.

    ## Phone numbers
    With country code, digits only, e.g. **79001234567**. The gateway passes the
    string to MAX as given.
  license:
    name: MIT
externalDocs:
  description: maxapi on GitHub (API.md is the full contract)
  url: https://github.com/50Bytes-dev/maxapi
servers:
- description: This gateway (the one serving this schema)
  url: /
tags:
- name: admin
  description: Gateway accounts (admin token)
- name: session
  description: QR login, connection, status and pause of an account
- name: chat
  description: Sending, editing and deleting messages, history, media downloads
- name: user
  description: MAX users and contacts
- name: group
  description: MAX group chats
- name: webhook
  description: The account's webhook URL
- name: health
  description: Liveness of the gateway
paths:
  /health:
    get:
      operationId: getHealth
      summary: Gateway health
      description: Answers 200 when the database answers a ping, 503 otherwise. MAX is not checked.
      tags:
      - health
      security: []
      responses:
        "200":
          description: The gateway and its database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        "503":
          description: The database does not answer (`success` false, `status` degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /admin/users:
    get:
      operationId: listUsers
      summary: List the accounts
      description: Every gateway account, ordered by id, with its token. Secrets of the MAX login are not shown.
      tags:
      - admin
      security:
      - AdminAuth: []
      responses:
        "200":
          description: The accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: addUser
      summary: Create an account
      description: |-
        Creates a gateway account and returns its id and account token. Nothing
        is validated. The account has no MAX login yet: `POST /session/connect`
        starts the QR login.
      tags:
      - admin
      security:
      - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserBody'
      responses:
        "200":
          description: The account is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUserResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/users/{userid}:
    parameters:
    - name: userid
      in: path
      required: true
      description: The account id from `POST /admin/users`
      schema:
        type: string
    get:
      operationId: getUser
      summary: Get an account
      description: |-
        One account with its settings. The MAX auth token is never shown, only
        whether one is stored (`auth_configured`); S3 keys are omitted and the
        proxy password is masked. The body is the account itself, without
        `success` or `data`.
      tags:
      - admin
      security:
      - AdminAuth: []
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "404":
          description: '`NOT_FOUND`: no account with this id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: '`INTERNAL_ERROR`: database error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateUser
      summary: Update an account
      description: |-
        Overwrites `name`, `webhook` and `events` with the body's values, an
        absent field with "". Succeeds for an unknown id too. The next event of
        the account already goes to the new webhook and subscription.
      tags:
      - admin
      security:
      - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserBody'
      responses:
        "200":
          description: Updated (`message` "User updated")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteUser
      summary: Delete an account
      description: |-
        Stops the account's MAX session and deletes the account with its MAX
        login and phone lookup cache. Succeeds for an unknown id too. No webhook
        is sent, and the session is not logged out in MAX (`POST /session/logout`
        does that). A pause of its MAX account stays. The account's token
        answers `401` from then on.
      tags:
      - admin
      security:
      - AdminAuth: []
      responses:
        "200":
          description: The account is deleted (`message` "User deleted")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "500":
          description: Database error (no `code`); the account stays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/connect:
    post:
      operationId: connect
      summary: Connect the account to MAX
      description: |-
        Overwrites the event subscription, then: without a stored MAX login,
        starts a QR login (`details` "Awaiting QR scan", webhook `QRGenerated`;
        read the QR from `GET /session/qr`); with a stored login and no session,
        logs in with it (`details` "Connected to MAX", webhook `Sync`); with the
        session already up, changes nothing else (`alreadyConnected` true and the
        account's pause). The MAX account id is not in this answer: read it from
        `GET /session/status` or the `Sync` event.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectBody'
      responses:
        "200":
          description: A QR login started, the stored login is being used, or the session was already up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: |-
            No `code`. A database error; the QR login could not be started (no
            connection to MAX, MAX refused it); or, with `immediate` false, the
            session was not up after 5 s ("failed to connect"; the login goes on
            in the background).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/qr:
    get:
      operationId: getQr
      summary: Get the QR of the running login
      description: |-
        The QR of the running QR login as a PNG data URL. The gateway issues a
        new QR when MAX's expires (webhook `QRGenerated`), so poll it every few
        seconds while it is shown. There is no `scanned` flag: the scan arrives
        as `QRScanned`, the login as `QRAuthorized` and `Sync`.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: The login waits for a scan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: |-
            No `code`. "no session": neither a QR login nor a session is up.
            "already logged in": a session is up and a MAX login is stored. Also
            a database error while reading the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/disconnect:
    post:
      operationId: disconnect
      summary: Disconnect the account
      description: |-
        Cancels the running QR login, or closes the MAX session and stops its
        reconnects. The stored MAX login stays: the next connect reuses it. The
        session is not logged out in MAX, and no webhook is sent. No body is
        read.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: Disconnected (`message` "Disconnected")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/AccountLookupError'
  /session/logout:
    post:
      operationId: logout
      summary: Log out of MAX and delete the account
      description: |-
        Logs the session out in MAX (when it is up), stops the reconnects and
        deletes the gateway account with its MAX login and phone lookup cache;
        the token answers 401 from now on. No webhook is sent for it. A pause of
        its MAX account stays. No body is read.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: Logged out and deleted (`message` "Logged out")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/AccountLookupError'
  /session/status:
    get:
      operationId: getStatus
      summary: Get the account's MAX session
      description: |-
        Reports the session, the stored login and the pause of the MAX account.
        No MAX call. Read `paused` before `connected`: a paused account keeps
        its session.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: The account's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/AccountLookupError'
  /session/resume:
    post:
      operationId: resume
      summary: Resume sending from the account
      description: |-
        Lifts the pause of the MAX account this account is logged into (the
        live session's, or the one stored at the last login), for every gateway
        account logged into it; `maxUserID` names the MAX account. An account
        that is not paused, or whose MAX account is unknown, answers the same.
        The body is optional. No MAX call.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeBody'
      responses:
        "200":
          description: The MAX account is not paused any more
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeResponse'
        "400":
          description: '`INVALID_INPUT`: the body is not JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: '`INTERNAL_ERROR`: database error; the account stays paused. Also a database error while reading the account (no `code`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/sync:
    post:
      operationId: sync
      summary: Log in again and return MAX's login data
      description: |-
        Closes the session and logs in again with the stored MAX login, then
        answers with MAX's login data (profile, chats, contacts, ...) and sends
        a `Sync` event with `manual` true. A failed login stops the session: it
        is not retried. No body is read.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: Logged in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        "400":
          description: No MAX login is stored (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: The login failed ("sync failed", no `code`), or a database error while reading the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhook:
    get:
      operationId: getWebhook
      summary: Get the webhook URL
      description: The account's webhook URL as the gateway currently uses it.
      tags:
      - webhook
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: The webhook URL ("" when none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/AccountLookupError'
    post:
      operationId: setWebhook
      summary: Set the webhook URL
      description: Stores the URL the account's events go to; "" sends none.
      tags:
      - webhook
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookBody'
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateWebhook
      summary: Set the webhook URL (the same as POST)
      description: The same as `POST /webhook`.
      tags:
      - webhook
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookBody'
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteWebhook
      summary: Remove the webhook URL
      description: Sets the webhook URL to ""; no events are sent from now on.
      tags:
      - webhook
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: Removed (`message` "Webhook deleted")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /chat/send/text:
    post:
      operationId: sendText
      summary: Send a text message
      description: |-
        Sends a text from the account to a chat, or to a person by phone. Every
        error carries a delivery outcome `code`: only `send_failed` (500) means
        the message may have arrived; every other error means nothing was sent.
        The checks run in this order: session, body, target, pause, lookup
        (cache, then MAX), send. Answers within ~9.5 s (lookup at most 4 s, the
        send's acknowledgement at most 5 s).

        A phone lookup's answer is cached per account: a found contact for 90
        days, MAX's `not.found` for 30 days. A MAX error on the lookup or the
        send whose code contains `restricted`, `limit`, `too.many`, `flood` or
        `spam` pauses the MAX account (`paused`, `pauseReason`); while paused
        every send of every gateway account of it answers 422 `send_rejected`
        without a MAX call, until `POST /session/resume`.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTextBody'
      responses:
        "200":
          description: MAX accepted the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTextResponse'
        "400":
          description: 'Not sent. `invalid_target`: neither `chatId` nor `phone` given. `INVALID_INPUT`: the body is missing or not JSON.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: |-
            `address_not_found`: not sent. `phone` is malformed, MAX has no user
            with it (`upstreamCode` "not.found" when MAX said so), or the lookup
            cache holds MAX's `not.found` younger than 30 days (no MAX call, no
            `upstreamCode`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: |-
            `send_rejected`: not sent. MAX refused the send (`upstreamCode`; a
            limit or restriction code also pauses the account: `paused`,
            `pauseReason`), or the account is paused (`paused`, `pauseReason`,
            no `upstreamCode`, no MAX call).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: |-
            `send_failed`: the outcome is unknown, MAX may have delivered the
            message (no answer in time, or the session was lost after the send
            went out); never resend it automatically. Also a database error while
            reading the account (no `code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: |-
            Not sent. `not_connected`: no live MAX session. `lookup_failed`: the
            phone lookup timed out, lost its connection or MAX answered it with
            an error other than `not.found` (`upstreamCode`; a limit or
            restriction code also pauses the account: `paused`, `pauseReason`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /chat/send/image:
    post:
      operationId: sendImage
      summary: Send an image
      description: |-
        Uploads an image to MAX and sends it with an optional caption. Errors
        carry no `code`; a 500 leaves the outcome unknown. The pause and the
        lookup cache of `POST /chat/send/text` do not apply here.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendImageBody'
      responses:
        "200":
          description: MAX accepted the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMediaResponse'
        "400":
          $ref: '#/components/responses/MediaBadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/MediaSendFailed'
        "503":
          $ref: '#/components/responses/NotConnected'
  /chat/send/audio:
    post:
      operationId: sendAudio
      summary: Send an audio file
      description: |-
        Uploads an audio file to MAX and sends it as a file. Errors carry no
        `code`; a 500 leaves the outcome unknown. The pause and the lookup cache
        of `POST /chat/send/text` do not apply here.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAudioBody'
      responses:
        "200":
          description: MAX accepted the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMediaResponse'
        "400":
          $ref: '#/components/responses/MediaBadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/MediaSendFailed'
        "503":
          $ref: '#/components/responses/NotConnected'
  /chat/send/document:
    post:
      operationId: sendDocument
      summary: Send a document
      description: |-
        Uploads a file to MAX and sends it with an optional caption. Errors
        carry no `code`; a 500 leaves the outcome unknown. The pause and the
        lookup cache of `POST /chat/send/text` do not apply here.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendDocumentBody'
      responses:
        "200":
          description: MAX accepted the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMediaResponse'
        "400":
          $ref: '#/components/responses/MediaBadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/MediaSendFailed'
        "503":
          $ref: '#/components/responses/NotConnected'
  /chat/send/video:
    post:
      operationId: sendVideo
      summary: Send a video
      description: |-
        Uploads a video to MAX and sends it with an optional caption. Errors
        carry no `code`; a 500 leaves the outcome unknown. The pause and the
        lookup cache of `POST /chat/send/text` do not apply here.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendVideoBody'
      responses:
        "200":
          description: MAX accepted the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMediaResponse'
        "400":
          $ref: '#/components/responses/MediaBadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/MediaSendFailed'
        "503":
          $ref: '#/components/responses/NotConnected'
  /chat/send/edit:
    post:
      operationId: editMessage
      summary: Edit a message
      description: Replaces the text of a message the account sent.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageBody'
      responses:
        "200":
          description: Edited (`message` "Message edited")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
