components:
  schemas:
    AddUserBody:
      properties:
        events:
          example: All
          type: string
        name:
          example: John Doe
          type: string
        webhook:
          example: https://example.com/webhook
          type: string
      type: object
    AddUserResponse:
      description: Response after creating a new user
      properties:
        id:
          example: a7e5dd6b-8b3e-4035-ba87-3f96a0e3f5c0
          type: string
        name:
          example: John Doe
          type: string
        success:
          example: true
          type: boolean
        token:
          example: abc123def456
          type: string
      type: object
    AudioBody:
      properties:
        audio:
          example: data:audio/mp3;base64,...
          type: string
        chatId:
          example: 123456789
          type: integer
        fileName:
          example: audio.mp3
          type: string
        notify:
          example: true
          type: boolean
        phone:
          example: "79001234567"
          type: string
      type: object
    AuthQRStartResponse:
      description: QR auth session created
      properties:
        expiresAt:
          example: 1776435251750
          type: integer
        pollingInterval:
          example: 5000
          type: integer
        qrCodeBase64:
          example: data:image/png;base64,...
          type: string
        qrLink:
          example: https://max.ru/:auth/6bc2adb2-6b23-4a7d-a96c-320bee4ed0d7
          type: string
        success:
          example: true
          type: boolean
        trackId:
          example: 6bc2adb2-6b23-4a7d-a96c-320bee4ed0d7
          type: string
        ttl:
          example: 120000
          type: integer
      type: object
    AuthQRStatusResponse:
      description: QR auth session status
      properties:
        authToken:
          example: auth_token_value
          type: string
        status:
          enum:
          - pending
          - scanned
          - authorized
          - expired
          example: pending
          type: string
        success:
          example: true
          type: boolean
      type: object
    ChatHistoryBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        count:
          example: 50
          type: integer
        fromTime:
          example: 0
          type: integer
      type: object
    ChatHistoryResponse:
      description: Response with chat history messages
      properties:
        messages:
          items:
            additionalProperties: {}
            type: object
          type: array
          uniqueItems: false
        success:
          example: true
          type: boolean
      type: object
    CheckUserBody:
      properties:
        phone:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    CheckUserResponse:
      description: Response with user existence check results
      properties:
        success:
          example: true
          type: boolean
        users:
          items:
            $ref: '#/components/schemas/CheckUserResultItem'
          type: array
          uniqueItems: false
      type: object
    CheckUserResultItem:
      description: Single user check result
      properties:
        exists:
          example: true
          type: boolean
        maxUserId:
          example: 123456789
          type: integer
        name:
          example: John Doe
          type: string
        phone:
          example: "79001234567"
          type: string
      type: object
    ConnectBody:
      properties:
        immediate:
          example: false
          type: boolean
        subscribe:
          example:
          - Message
          - ReadReceipt
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    ContactsResponse:
      description: Response with list of contacts
      properties:
        contacts:
          items:
            additionalProperties: {}
            type: object
          type: array
          uniqueItems: false
        count:
          example: 42
          type: integer
        success:
          example: true
          type: boolean
      type: object
    CreateGroupBody:
      properties:
        name:
          example: My Group
          type: string
        participants:
          items:
            type: integer
          type: array
          uniqueItems: false
      type: object
    DeleteMessageBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        forMe:
          example: false
          type: boolean
        messageIds:
          items:
            type: integer
          type: array
          uniqueItems: false
      type: object
    DocumentBody:
      properties:
        caption:
          example: Document caption
          type: string
        chatId:
          example: 123456789
          type: integer
        document:
          example: data:application/pdf;base64,...
          type: string
        fileName:
          example: document.pdf
          type: string
        notify:
          example: true
          type: boolean
        phone:
          example: "79001234567"
          type: string
      type: object
    DownloadBody:
      properties:
        url:
          example: https://example.com/image.jpg
          type: string
      type: object
    DownloadFileBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        fileId:
          example: 111222333
          type: integer
        messageId:
          example: 987654321
          type: integer
        videoId:
          example: 111222333
          type: integer
      type: object
    DownloadMediaResponse:
      description: Response with downloaded media data
      properties:
        data:
          example: base64_encoded_data
          type: string
        mimeType:
          example: image/jpeg
          type: string
        success:
          example: true
          type: boolean
      type: object
    DownloadVideoResponse:
      description: Response with downloaded video data
      properties:
        data:
          example: base64_encoded_data
          type: string
        mimeType:
          example: video/mp4
          type: string
        success:
          example: true
          type: boolean
        url:
          example: https://example.com/video.mp4
          type: string
      type: object
    EditMessageBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        messageId:
          example: 987654321
          type: integer
        text:
          example: Updated message
          type: string
      type: object
    EditUserBody:
      properties:
        events:
          example: All
          type: string
        name:
          example: John Doe
          type: string
        webhook:
          example: https://example.com/webhook
          type: string
      type: object
    ErrorResponse:
      description: Error response format
      properties:
        error:
          example: error message
          type: string
        success:
          example: false
          type: boolean
      type: object
    GroupChatResponse:
      description: Response with group or chat information
      properties:
        chat:
          additionalProperties: {}
          type: object
        success:
          example: true
          type: boolean
      type: object
    GroupInfoBody:
      properties:
        chatId:
          example: 123456789
          type: integer
      type: object
    GroupJoinBody:
      properties:
        link:
          example: https://max.ru/join/abc123
          type: string
      type: object
    GroupNameBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        name:
          example: New Group Name
          type: string
      type: object
    GroupTopicBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        topic:
          example: Group description
          type: string
      type: object
    ImageBody:
      properties:
        caption:
          example: Image caption
          type: string
        chatId:
          example: 123456789
          type: integer
        image:
          example: data:image/jpeg;base64,...
          type: string
        notify:
          example: true
          type: boolean
        phone:
          example: "79001234567"
          type: string
      type: object
    InviteLinkResponse:
      description: Response with group invite link
      properties:
        inviteLink:
          example: https://max.ru/join/abc123
          type: string
        success:
          example: true
          type: boolean
      type: object
    ListUsersResponse:
      description: Response with list of users
      properties:
        data:
          items:
            $ref: '#/components/schemas/UserResponse'
          type: array
          uniqueItems: false
        success:
          example: true
          type: boolean
      type: object
    MarkReadBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        messageId:
          example: 987654321
          type: integer
      type: object
    MessageBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        notify:
          example: true
          type: boolean
        phone:
          example: "79001234567"
          type: string
        replyTo:
          example: 0
          type: integer
        text:
          example: Hello, World!
          type: string
      type: object
    MessageResponse:
      description: Simple success response with message
      properties:
        message:
          example: Operation completed
          type: string
        success:
          example: true
          type: boolean
      type: object
    PresenceBody:
      properties:
        chatId:
          example: 123456789
          type: integer
      type: object
    ReactBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        messageId:
          example: "987654321"
          type: string
        reaction:
          example: "\U0001F44D"
          type: string
      type: object
    SendMessageResponse:
      description: Response after sending a message
      properties:
        chatId:
          example: 123456789
          type: integer
        messageId:
          example: 987654321
          type: integer
        success:
          example: true
          type: boolean
      type: object
    StatusResponse:
      description: Connection and authentication status
      properties:
        authenticated:
          example: true
          type: boolean
        connected:
          example: true
          type: boolean
        loggedIn:
          example: true
          type: boolean
        maxUserID:
          example: 123456789
          type: integer
        success:
          example: true
          type: boolean
      type: object
    UpdateParticipantsBody:
      properties:
        chatId:
          example: 123456789
          type: integer
        operation:
          enum:
          - add
          - remove
          example: add
          type: string
        userIds:
          items:
            type: integer
          type: array
          uniqueItems: false
      type: object
    UserInfoBody:
      properties:
        userIds:
          items:
            type: integer
          type: array
          uniqueItems: false
      type: object
    UserInfoResponse:
      description: Response with user information (always returns array)
      properties:
        count:
          example: 1
          type: integer
        success:
          example: true
          type: boolean
        users:
          items:
            additionalProperties: {}
            type: object
          type: array
          uniqueItems: false
      type: object
    UserResponse:
      properties:
        authenticated:
          example: true
          type: boolean
        connected:
          example: 1
          type: integer
        events:
          example: All
          type: string
        id:
          example: a7e5dd6b-8b3e-4035-ba87-3f96a0e3f5c0
          type: string
        maxUserId:
          example: 123456789
          type: integer
        name:
          example: John Doe
          type: string
        token:
          example: abc123def456
          type: string
        webhook:
          example: https://example.com/webhook
          type: string
      type: object
    VideoBody:
      properties:
        caption:
          example: Video caption
          type: string
        chatId:
          example: 123456789
          type: integer
        fileName:
          example: video.mp4
          type: string
        notify:
          example: true
          type: boolean
        phone:
          example: "79001234567"
          type: string
        video:
          example: data:video/mp4;base64,...
          type: string
      type: object
    WebhookBody:
      properties:
        webhook:
          example: https://example.com/webhook
          type: string
      type: object
    WebhookResponse:
      description: Response with webhook URL
      properties:
        success:
          example: true
          type: boolean
        webhook:
          example: https://example.com/webhook
          type: string
      type: object
  securitySchemes:
    AdminAuth:
      description: Admin token for admin endpoints
      in: header
      name: Authorization
      type: apiKey
    ApiKeyAuth:
      description: User token for authentication
      in: header
      name: token
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    MaxAPI implements a multi-user and multi-device REST API for MAX Messenger.

    ## Authentication
    - **Standard Endpoints**: Include the `token` header with a valid user token
    - **Admin Endpoints**: Use the `Authorization` header with the admin token (set in .env as MAXAPI_ADMIN_TOKEN)

    ## Phone number format
    - Required: Country code (e.g. **79001234567** for Russia)
    - Do not prefix with a plus sign (+)
  title: MaxAPI
  version: 3.0.0
openapi: 3.1.0
paths:
  /admin/users:
    get:
      description: Returns every user registered in the system.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - AdminAuth: []
      summary: List all users
      tags:
      - Admin
    post:
      description: Creates a new user in the system
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserBody'
        description: User data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUserResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - AdminAuth: []
      summary: Create user
      tags:
      - Admin
  /admin/users/{userid}:
    delete:
      description: Deletes a user from the system
      parameters:
      - description: User ID
        in: path
        name: userid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - AdminAuth: []
      summary: Delete user
      tags:
      - Admin
    get:
      description: Returns a single user by their ID.
      parameters:
      - description: User ID
        in: path
        name: userid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - AdminAuth: []
      summary: Get user by ID
      tags:
      - Admin
    put:
      description: Updates an existing user
      parameters:
      - description: User ID
        in: path
        name: userid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditUserBody'
        description: User data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - AdminAuth: []
      summary: Update user
      tags:
      - Admin
  /chat/delete:
    post:
      description: Deletes messages from a chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMessageBody'
        description: Delete data
