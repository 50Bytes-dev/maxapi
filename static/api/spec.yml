        "409":
          $ref: '#/components/responses/PausedByCall'
        "500":
          $ref: '#/components/responses/AccountLookupError'
        "502":
          $ref: '#/components/responses/UpstreamError'
        "503":
          $ref: '#/components/responses/NotConnected'
  /user/check:
    post:
      operationId: checkUsers
      summary: Look phone numbers up in MAX
      description: |-
        Tells for each number, at most 50, whether MAX has a user with it,
        through the lookup cache of the sends: a number found within 90 days,
        or refused with MAX's `not.found` within 30, makes no MAX call, and a
        number looked up here is cached for the send that follows. The rest is
        looked up in MAX one by one, each within 4 s. A number whose lookup
        failed gets `exists` false plus `error` (and `upstreamCode` when MAX
        answered). A stop signal on a lookup pauses the account and ends the
        call with 409 `page_paused`; while paused no lookup is made.
      tags:
      - user
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUsersBody'
      responses:
        "200":
          description: One result per number, in order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckUsersResponse'
        "400":
          $ref: '#/components/responses/BadBody'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/PagePaused'
        "500":
          $ref: '#/components/responses/AccountLookupError'
        "503":
          $ref: '#/components/responses/NotConnected'
  /user/info:
    post:
      operationId: getUserInfo
      summary: Get MAX users by id
      description: |-
        MAX users by their ids (1 to 100), from the session's memory or from MAX
        (CONTACT_INFO, opcode 32): names, photo, and `phone` when MAX shows it
        to the account. This replaces the `contacts` that `Sync` carried before
        2.0.0. Answers within 8 s.
      tags:
      - user
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfoBody'
      responses:
        "200":
          description: The users MAX knows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        "400":
          description: The body is missing or not JSON, or `userIds` is empty (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/PausedByCall'
