webhooks:
  event:
    post:
      operationId: webhookEvent
      summary: An event of the account
      description: |-
        The gateway posts each event to the account's webhook when the account
        is subscribed to its type (or to `All`). Events are posted concurrently
        and are not ordered; order them by `eventTimestamp`. The body never
        carries the account token, but `QRAuthorizedEvent` carries the MAX auth
        token, and `SyncEvent` and the message events the owner's chats and
        messages. Delivery is retried on a network error, 5xx, 408 and 429
        (`WEBHOOK_RETRY_COUNT` attempts, from `WEBHOOK_RETRY_DELAY` seconds,
        doubling).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        "200":
          description: Any 2xx, 3xx or non-retried 4xx ends the delivery
components:
  securitySchemes:
    AdminAuth:
      type: apiKey
      in: header
      name: Authorization
      description: The admin token (`MAXAPI_ADMIN_TOKEN`), raw, without `Bearer`
    ApiKeyAuth:
      type: apiKey
      in: header
      name: token
      description: The account token from `POST /admin/users`
  responses:
    AdminUnauthorized:
      description: 'Wrong or missing admin token: `{"success": false, "error": "unauthorized"}`, no `code`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 'Unknown account token: `{"success": false, "error": "unauthorized"}`, no `code`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountLookupError:
      description: A database error while reading the account by its token (no `code`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotConnected:
      description: '"not connected": no live MAX session (no `code`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadBody:
      description: The body is missing or not JSON (no `code`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MAXCallFailed:
      description: MAX refused the call or did not answer it in time (no `code`), or a database error while reading the account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ChatNotFound:
      description: MAX did not give the chat ("chat not found", no `code`), also when MAX did not answer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MediaBadRequest:
      description: |-
        Not sent (no `code`): the body is missing or not JSON, the `phone`
        lookup failed for any reason ("user not found"), or the media could not
        be decoded or downloaded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MediaSendFailed:
      description: |-
        "send failed" (no `code`): the upload or the send failed; the outcome is
        unknown. Also a database error while reading the account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: |-
        The error body of every call. Most errors carry no `code`: only
        `POST /chat/send/text`, `POST /session/resume` and
        `GET /admin/users/{userid}` send one. Only `POST /chat/send/text` adds
        `upstreamCode` and the account's pause.
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: A human-readable text, often with MAX's error inside; it may change. Do not branch on it.
          example: 'send rejected: Refused: Refused (chat.denied)'
        code:
          type: string
          description: |-
            The machine code, when the answer has one. `POST /chat/send/text`:
            the delivery outcome codes `not_connected`, `invalid_target`,
            `address_not_found`, `lookup_failed`, `send_rejected`, `send_failed`
            (`address_refused` is reserved and not sent yet), and
            `INVALID_INPUT`. `POST /session/resume`: `INVALID_INPUT`,
            `INTERNAL_ERROR`. `GET /admin/users/{userid}`: `NOT_FOUND`,
            `INTERNAL_ERROR`. Treat an unknown code as a failure of the call.
          example: send_rejected
        upstreamCode:
          type: string
          description: |-
            The error code MAX itself answered with (`chat.denied`, `not.found`,
            `error.user.restricted.send`). Absent when MAX did not answer with an
            error: a timeout, a lost session, or a refusal by the gateway itself.
          example: chat.denied
        paused:
          type: boolean
          description: |-
            Present (true) only when sending from the MAX account is paused: by
            this refusal, or before it. Stop sending from every connection of
            this MAX account until `POST /session/resume`.
        pauseReason:
          $ref: '#/components/schemas/PauseReason'
    PauseReason:
      type: string
      description: Why sending from the MAX account is paused. maxapi gives only `spam` (a limit or restriction error of MAX).
      example: spam
    EventType:
      type: string
      description: |-
        A webhook event type. `All` subscribes to every event. `Connected`,
        `FileReady` and `HistorySync` are accepted but never sent.
      enum:
      - Message
      - MessageEdit
      - MessageDelete
      - ReadReceipt
      - Connected
      - Disconnected
      - Reconnecting
      - ReconnectExhausted
      - Sync
      - LoggedOut
      - QRGenerated
      - QRScanned
      - QRAuthorized
      - QRExpired
      - AuthExpired
      - ChatUpdate
      - Typing
      - ReactionChange
      - ContactUpdate
      - PresenceUpdate
      - FileReady
      - HistorySync
      - All
    MessageResponse:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User deleted
    HealthResponse:
      type: object
      required:
      - success
      - status
      - version
      - uptime_seconds
      - db_ok
      - rabbitmq_ok
      - connected_users
      - goroutines
      - mem_alloc_mb
      - timestamp
      properties:
        success:
          type: boolean
          description: false when the database does not answer
          example: true
        status:
          type: string
          description: '`ok`, or `degraded` when the database does not answer'
          example: ok
        version:
          type: string
          example: 1.5.0
        uptime_seconds:
          type: integer
          format: int64
          example: 12345
        db_ok:
          type: boolean
          example: true
        rabbitmq_ok:
          type: boolean
          description: RabbitMQ is configured and connected
          example: false
        connected_users:
          type: integer
          description: Accounts with a live MAX connection
          example: 3
        goroutines:
          type: integer
          example: 87
        mem_alloc_mb:
          type: integer
          format: int64
          example: 67
        timestamp:
          type: integer
          format: int64
          description: Unix time in seconds
          example: 1793001234
    AddUserBody:
      type: object
      properties:
        name:
          type: string
          description: Account name; shown in the webhook's `instanceName`. Not validated.
          example: Shop bot
        webhook:
          type: string
          description: Where events go, used exactly as given. Empty means no events.
          example: https://example.com/webhook
        events:
          type: string
          description: |-
            Comma-separated event subscription of `EventType` names, stored as
            given. `POST /session/connect` overwrites it with `subscribe`.
          example: Sync,QRAuthorized,AuthExpired,LoggedOut
    AddUserResponse:
      type: object
      required:
      - success
      - id
      - token
      - name
      properties:
        success:
          type: boolean
          example: true
        id:
          type: string
          description: The account id, for `/admin/users/{userid}`
          example: 6f1c2d4e-8b3e-4035-ba87-3f96a0e3f5c0
        token:
          type: string
          description: The account token, for the `token` header
          example: 0b7a9e31-5d2c-4f6a-9e8b-1c2d3e4f5a6b
        name:
          type: string
          example: Shop bot
    UpdateUserBody:
      type: object
      description: All three fields are written; an absent one becomes "".
      properties:
        name:
          type: string
          example: Shop bot
        webhook:
          type: string
          example: https://example.com/webhook
        events:
          type: string
          description: Comma-separated `EventType` names, stored as given
          example: Sync,QRAuthorized,AuthExpired,LoggedOut
    ListUsersResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type:
          - array
          - "null"
          description: The accounts; null when there are none
          items:
            $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      required:
      - id
      - name
      - token
      - maxUserId
      - webhook
      - events
      - connected
      - authenticated
      properties:
        id:
          type: string
          example: 6f1c2d4e-8b3e-4035-ba87-3f96a0e3f5c0
        name:
          type: string
          example: Shop bot
        token:
          type: string
          description: The account token
          example: 0b7a9e31-5d2c-4f6a-9e8b-1c2d3e4f5a6b
        maxUserId:
          type:
          - integer
          - "null"
          format: int64
          description: The MAX id stored at the last login; null before the first
          example: 123456789
        webhook:
          type: string
          example: https://example.com/webhook
        events:
          type: string
          description: The stored subscription, comma-separated
          example: Sync,QRAuthorized,AuthExpired,LoggedOut
        connected:
          type: integer
          description: The stored connected flag, 1 or 0 (not the live session)
          example: 1
        authenticated:
          type: boolean
          description: A MAX login is stored
          example: true
    UserDetail:
      type: object
      required:
      - id
      - name
      - token
      - webhook
      - max_user_id
      - device_id
      - connected
      - connected_flag
      - auth_configured
      - events
      - proxy_configured
      - proxy_url
      - history
      - s3_enabled
      - s3_endpoint
      - s3_region
      - s3_bucket
      - media_delivery
      properties:
        id:
          type: string
          example: 6f1c2d4e-8b3e-4035-ba87-3f96a0e3f5c0
        name:
          type: string
          example: Shop bot
        token:
          type: string
          description: The account token
          example: 0b7a9e31-5d2c-4f6a-9e8b-1c2d3e4f5a6b
        webhook:
          type: string
          example: https://example.com/webhook
        max_user_id:
          type: integer
          format: int64
          description: The MAX id stored at the last login; 0 before the first
          example: 123456789
        device_id:
          type: string
          description: The device id the gateway logs into MAX with
          example: 6e8ed92f-1c2d-4e5f-8a9b-0c1d2e3f4a5b
        connected:
          type: boolean
          description: The MAX connection is up now
          example: true
        connected_flag:
          type: boolean
          description: The stored connected flag
          example: true
        auth_configured:
          type: boolean
          description: A MAX login (auth token) is stored; the token itself is never shown
          example: true
        events:
          type: array
          description: The stored subscription
          items:
            type: string
          example:
          - Sync
          - QRAuthorized
        proxy_configured:
          type: boolean
          example: false
        proxy_url:
          type: string
          description: The proxy URL with its password replaced by `***`
          example: http://user:***@proxy.internal:3128
        history:
          type: integer
          description: How many messages per chat the gateway keeps in its history; 0 keeps none
          example: 0
        s3_enabled:
          type: boolean
          example: false
        s3_endpoint:
          type: string
          example: ""
        s3_region:
          type: string
          example: ""
        s3_bucket:
          type: string
          example: ""
        media_delivery:
          type: string
          description: '`base64`, `s3` or `both`: how photos of incoming messages reach the webhook'
          example: base64
    ConnectBody:
      type: object
      description: The body is required; `{}` is enough.
      properties:
        subscribe:
          type: array
          description: The event subscription; overwrites the stored one, also when already connected. Duplicates are kept once.
          items:
            $ref: '#/components/schemas/EventType'
          example:
          - Sync
          - QRAuthorized
          - AuthExpired
          - LoggedOut
          - Disconnected
          - Reconnecting
          - QRGenerated
          - QRScanned
          - QRExpired
        immediate:
          type: boolean
          description: |-
            false (default): with a stored login and no session, wait 5 s for the
            session and answer 500 "failed to connect" if it is not up. true:
            answer at once; the outcome arrives as `Sync` or `AuthExpired`.
          example: true
    ConnectResponse:
      type: object
      required:
      - success
      - details
      - events
      properties:
        success:
          type: boolean
          example: true
        details:
          type: string
          description: '"Awaiting QR scan", "Connected to MAX" or "Already connected to MAX"'
          example: Already connected to MAX
        events:
          type: string
          description: The stored subscription, comma-separated
          example: Sync,QRAuthorized,AuthExpired,LoggedOut
        alreadyConnected:
          type: boolean
          description: Present (true) only when the session was already up
        paused:
          type: boolean
          description: Whether sending from the MAX account is paused; only with `alreadyConnected`
        pauseReason:
          $ref: '#/components/schemas/PauseReason'
        upstreamCode:
          type: string
          description: Only while paused (and `alreadyConnected`); the MAX error code that paused the account
          example: error.user.restricted.send
    QRResponse:
      type: object
      required:
      - success
      - qrcode
      properties:
        success:
          type: boolean
          example: true
        qrcode:
          type: string
          description: A 256x256 PNG data URL of MAX's login link; "" between a scan and the login
          example: data:image/png;base64,iVBORw0KGgo...
    StatusResponse:
      type: object
      required:
      - success
      - connected
      - authenticated
      - loggedIn
      - maxUserID
      - paused
      properties:
        success:
          type: boolean
          example: true
        connected:
          type: boolean
          description: The account's MAX connection is up (the QR login's connection too). A paused account keeps its session.
        authenticated:
          type: boolean
          description: A MAX login (auth token) is stored
        loggedIn:
          type: boolean
          description: '`connected` and `authenticated`'
        maxUserID:
          type: integer
          format: int64
          description: The MAX id of the session's account; 0 while no logged-in session is up
          example: 123456789
        paused:
          type: boolean
          description: |-
            Whether sending from the MAX account is paused: the live session's
            account, or without a session the one stored at the last login. Read
            it before `connected`.
        pauseReason:
          $ref: '#/components/schemas/PauseReason'
        upstreamCode:
          type: string
          description: Only while paused; the MAX error code that paused the account
          example: error.user.restricted.send
    ResumeBody:
      type: object
      description: Optional; no body and `{}` work too.
      properties:
        captchaKey:
          type: string
          description: Part of the VK gateway's contract; read and ignored (a MAX pause has no captcha).
          deprecated: true
    ResumeResponse:
      type: object
      required:
      - success
      - maxUserID
      properties:
        success:
          type: boolean
          example: true
        maxUserID:
          type: integer
          format: int64
          description: The MAX account whose pause was lifted; 0 when unknown
          example: 123456789
    SyncResponse:
      type: object
      description: '`success`, `maxUserID` and every field of MAX''s login answer (`profile`, `chats`, `contacts`, ...), as MAX sends them.'
      required:
      - success
      - maxUserID
      properties:
        success:
          type: boolean
          example: true
        maxUserID:
          type: integer
          format: int64
          example: 123456789
      additionalProperties: true
    WebhookBody:
      type: object
      properties:
        webhook:
          type: string
          description: The URL; "" sends no events
          example: https://example.com/webhook
    WebhookResponse:
      type: object
      required:
      - success
      - webhook
      properties:
        success:
          type: boolean
          example: true
        webhook:
          type: string
          example: https://example.com/webhook
    SendTextBody:
      type: object
      description: One of `chatId` and `phone` is required; with both, `chatId` wins. Unknown fields are ignored.
      properties:
        chatId:
          type: integer
          format: int64
          description: The MAX chat id. 0 means none (chat 0 is the account's own Favorites and is never addressed here).
          example: 123456789
        phone:
          type: string
          description: The recipient's phone with country code; looked up in the cache, then in MAX. The cache key is the string exactly as sent.
          example: "79001234567"
        text:
          type: string
          example: Заказ 123 готов к выдаче
        replyTo:
          type: integer
          format: int64
          description: Id of the message to reply to; 0 for none
          example: 0
        notify:
          type: boolean
          description: Whether MAX notifies the recipient; default false
          example: true
    SendTextResponse:
      type: object
      required:
      - success
      - messageId
      - chatId
      properties:
        success:
          type: boolean
          example: true
        messageId:
          type: string
          description: MAX's id of the new message, as a string
          example: "115478893120847321"
        chatId:
          type: integer
          format: int64
          description: The chat the message went to; for a send by `phone`, the dialog of the account and the recipient
          example: 123456789
    SendImageBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          description: The MAX chat id; when 0, `phone` is looked up
          example: 123456789
        phone:
          type: string
          example: "79001234567"
        image:
          type: string
          description: A data URL, an http(s) URL the gateway downloads, or plain base64
          example: data:image/jpeg;base64,/9j/4AAQ...
        caption:
          type: string
          example: Ваш заказ
        notify:
          type: boolean
          example: true
    SendAudioBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          description: The MAX chat id; when 0, `phone` is looked up
          example: 123456789
        phone:
          type: string
          example: "79001234567"
        audio:
          type: string
          description: A data URL, an http(s) URL the gateway downloads, or plain base64
          example: data:audio/mpeg;base64,SUQz...
        fileName:
          type: string
          description: Default `audio.mp3`
          example: audio.mp3
        notify:
          type: boolean
          example: true
    SendDocumentBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          description: The MAX chat id; when 0, `phone` is looked up
          example: 123456789
        phone:
          type: string
          example: "79001234567"
        document:
          type: string
          description: A data URL, an http(s) URL the gateway downloads, or plain base64
          example: data:application/pdf;base64,JVBERi0...
        fileName:
          type: string
          description: Default `document`
          example: invoice.pdf
        caption:
          type: string
          example: Счёт
        notify:
          type: boolean
          example: true
    SendVideoBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          description: The MAX chat id; when 0, `phone` is looked up
          example: 123456789
        phone:
          type: string
          example: "79001234567"
        video:
          type: string
          description: A data URL, an http(s) URL the gateway downloads, or plain base64
          example: data:video/mp4;base64,AAAAIGZ0eXA...
        fileName:
          type: string
          description: Default `video.mp4`
          example: video.mp4
        caption:
          type: string
          example: Обзор
        notify:
          type: boolean
          example: true
    SendMediaResponse:
      type: object
      required:
      - success
      - messageId
      properties:
        success:
          type: boolean
          example: true
        messageId:
          type: string
          description: MAX's id of the new message, as a string
          example: "115478893120847321"
    EditMessageBody:
      type: object
      required:
      - chatId
      - messageId
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        messageId:
          type: integer
          format: int64
          example: 115478893120847321
        text:
          type: string
          example: Исправленный текст
    DeleteMessagesBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        messageIds:
          type: array
          items:
            type: integer
            format: int64
          example:
          - 115478893120847321
        forMe:
          type: boolean
          description: Delete only for the account
          example: false
    ReactBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        messageId:
          type: string
          description: The message id as a string
          example: "115478893120847321"
        reaction:
          type: string
          description: The emoji; empty removes the account's reaction
          example: 👍
    MarkReadBody:
      type: object
      required:
      - chatId
      - messageId
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        messageId:
          type: integer
          format: int64
          example: 115478893120847321
    ChatHistoryBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        count:
          type: integer
          description: How many messages before `fromTime`; 0 means 50
          example: 50
        fromTime:
          type: integer
          format: int64
          description: Unix time in milliseconds; 0 means now
          example: 0
    ChatHistoryResponse:
      type: object
      required:
      - success
      - messages
      properties:
        success:
          type: boolean
          example: true
        messages:
          type:
          - array
          - "null"
          description: The messages; null when there are none
          items:
            $ref: '#/components/schemas/MaxMessage'
    DownloadUrlBody:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          example: https://i.oneme.ru/i?r=BTGBPUwtwgYUeoFhO7rESmr8
    DownloadDocumentBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        messageId:
          type: integer
          format: int64
          example: 115478893120847321
        fileId:
          type: integer
          format: int64
          description: The attachment's `fileId`
          example: 111222333
    DownloadVideoBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        messageId:
          type: integer
          format: int64
          example: 115478893120847321
        videoId:
          type: integer
          format: int64
          description: The attachment's `videoId`
          example: 111222333
    DownloadMediaResponse:
      type: object
      required:
      - success
      - data
      - mimeType
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          description: The file in base64
          example: /9j/4AAQSkZJRg...
        mimeType:
          type: string
          description: Sniffed from the bytes
          example: image/jpeg
    DownloadVideoResponse:
      type: object
      required:
      - success
      - data
      - mimeType
      - url
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          description: The video in base64
          example: AAAAIGZ0eXA...
        mimeType:
          type: string
          description: Sniffed from the bytes
          example: video/mp4
        url:
          type: string
          description: MAX's download URL
          example: https://vd.okcdn.ru/?expires=...
    ContactsResponse:
      type: object
      required:
      - success
      - contacts
      - count
      properties:
        success:
          type: boolean
          example: true
        contacts:
          type:
          - array
          - "null"
          description: The contacts; null when there are none
          items:
            $ref: '#/components/schemas/MaxContact'
        count:
          type: integer
          example: 42
    CheckUsersBody:
      type: object
      properties:
        phone:
          type: array
          description: Phone numbers with country code
          items:
            type: string
          example:
          - "79001234567"
    CheckUsersResponse:
      type: object
      required:
      - success
      - users
      properties:
        success:
          type: boolean
          example: true
        users:
          type: array
          items:
            $ref: '#/components/schemas/CheckUsersResult'
    CheckUsersResult:
      type: object
      required:
      - phone
      - exists
      - maxUserId
      properties:
        phone:
          type: string
          example: "79001234567"
        exists:
          type: boolean
          description: MAX has a user with the number
          example: true
        maxUserId:
          type: integer
          format: int64
          description: The user's MAX id; 0 when not found
          example: 987654321
        name:
          type: string
          description: The user's first name in MAX, when found
          example: Иван
        error:
          type: string
          description: Present when the lookup itself failed; `exists` false then does not mean that MAX has no such user
          example: 'Timeout Error: Request timed out'
    UserInfoBody:
      type: object
      required:
      - userIds
      properties:
        userIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          example:
          - 987654321
    UserInfoResponse:
      type: object
      required:
      - success
      - users
      - count
      properties:
        success:
          type: boolean
          example: true
        users:
          type: array
          items:
            $ref: '#/components/schemas/MaxUserInfo'
        count:
          type: integer
          example: 1
    ChatIdBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
    CreateGroupBody:
      type: object
      properties:
        name:
          type: string
          example: Покупатели
        participants:
          type: array
          description: MAX user ids
          items:
            type: integer
            format: int64
          example:
          - 987654321
    GroupJoinBody:
      type: object
      properties:
        link:
          type: string
          example: https://max.ru/join/abc123
    GroupNameBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        name:
          type: string
          example: Покупатели
    GroupTopicBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        topic:
          type: string
          example: Новости магазина
    UpdateParticipantsBody:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          example: 123456789
        userIds:
          type: array
          items:
            type: integer
            format: int64
          example:
          - 987654321
        operation:
          type: string
          description: '`add` adds; anything else removes'
          enum:
          - add
          - remove
          example: add
    GroupResponse:
      type: object
      required:
      - success
      - chat
      properties:
        success:
          type: boolean
          example: true
        chat:
          $ref: '#/components/schemas/MaxChat'
    InviteLinkResponse:
      type: object
      required:
      - success
      - inviteLink
      properties:
        success:
          type: boolean
          example: true
        inviteLink:
          type: string
          description: '"" when the chat has no link'
          example: https://max.ru/join/abc123
    MaxName:
      type: object
      description: A name of a MAX user, as MAX gives it
      properties:
        name:
          type: string
          example: Иван Петров
        firstName:
          type: string
          example: Иван
        lastName:
          type: string
          example: Петров
        type:
          type: string
          example: ONEME
    MaxContact:
      type: object
      description: A contact, as MAX gives it
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
          example: 987654321
        accountStatus:
          type: integer
          example: 0
        baseRawUrl:
          type: string
        baseUrl:
          type: string
        names:
          type: array
          items:
            $ref: '#/components/schemas/MaxName'
        options:
          type: array
          items:
            type: string
        photoId:
          type: integer
          format: int64
        updateTime:
          type: integer
          format: int64
    MaxUserInfo:
      type: object
      description: A MAX user. Every field is present; `names` and `options` may be null.
      required:
      - id
      - accountStatus
      - names
      - options
      - baseUrl
      - baseRawUrl
      - photoId
      - description
      - gender
      - link
      - updateTime
      - webApp
      - avatarUrl
      properties:
        id:
          type: integer
          format: int64
          example: 987654321
        accountStatus:
          type: integer
          example: 0
        names:
          type:
          - array
          - "null"
          items:
            $ref: '#/components/schemas/MaxName'
        options:
          type:
          - array
          - "null"
          items:
            type: string
        baseUrl:
          type: string
        baseRawUrl:
          type: string
        photoId:
          type: integer
          format: int64
        description:
          type: string
        gender:
          type: integer
        link:
          type: string
        updateTime:
          type: integer
          format: int64
        webApp:
          type: string
        avatarUrl:
          type: string
          description: '`baseRawUrl`, else `baseUrl`; "" when neither'
    MaxChat:
      type: object
      description: A chat, as MAX gives it
      required:
      - id
      - type
      properties:
        id:
          type: integer
          format: int64
          example: -68000000000001
        cid:
          type: integer
          format: int64
        type:
          type: string
          description: '`DIALOG`, `CHAT` or `CHANNEL`'
          example: CHAT
        title:
          type: string
          example: Покупатели
        description:
          type: string
        owner:
          type: integer
          format: int64
        access:
          type: string
        link:
          type: string
        participants:
          type: object
          description: MAX user id → MAX's value for the member
          additionalProperties:
            type: integer
            format: int64
        participantsCount:
          type: integer
        admins:
          type: array
          items:
            type: integer
            format: int64
        adminParticipants:
          type: object
          additionalProperties: true
        lastMessage:
          $ref: '#/components/schemas/MaxMessage'
        options:
          $ref: '#/components/schemas/MaxChatOptions'
        created:
          type: integer
          format: int64
        modified:
          type: integer
          format: int64
        joinTime:
          type: integer
          format: int64
        messagesCount:
          type: integer
        status:
          type: string
        baseIconUrl:
          type: string
        baseRawIconUrl:
          type: string
        lastEventTime:
          type: integer
          format: int64
        lastDelayedUpdateTime:
          type: integer
          format: int64
        lastFireDelayedErrorTime:
          type: integer
          format: int64
    MaxChatOptions:
      type: object
      properties:
        ONLY_OWNER_CAN_CHANGE_ICON_TITLE:
          type: boolean
        ALL_CAN_PIN_MESSAGE:
          type: boolean
        ONLY_ADMIN_CAN_ADD_MEMBER:
          type: boolean
        ONLY_ADMIN_CAN_CALL:
          type: boolean
        MEMBERS_CAN_SEE_PRIVATE_LINK:
          type: boolean
    MaxMessage:
      type: object
      description: A message, as MAX gives it
      required:
      - id
      - text
      - time
      - type
      properties:
        id:
          type: string
          example: "115478893120847321"
        chatId:
          type: integer
          format: int64
        sender:
          type: integer
          format: int64
          description: The sender's MAX id
        text:
          type: string
        time:
          type: integer
          format: int64
          description: Unix time in milliseconds
        type:
          type: string
          description: '`TEXT`, `SYSTEM` or `SERVICE`'
          example: TEXT
        status:
          type: string
          description: '`EDITED` or `REMOVED` when so'
        options:
          type: integer
        elements:
          type: array
          items:
            $ref: '#/components/schemas/MaxElement'
        attaches:
          type: array
          items:
            $ref: '#/components/schemas/MaxAttachment'
        link:
          $ref: '#/components/schemas/MaxMessageLink'
        reactionInfo:
          $ref: '#/components/schemas/MaxReactionInfo'
        cid:
          type: integer
          format: int64
    MaxElement:
      type: object
      description: A formatting span of a message's text
      properties:
        type:
          type: string
          description: '`STRONG`, `EMPHASIZED`, `UNDERLINE`, `STRIKETHROUGH`, ...'
        from:
          type: integer
        length:
          type: integer
    MaxAttachment:
      type: object
      description: An attachment of a message; the fields present depend on `_type`
      properties:
        _type:
          type: string
          description: '`PHOTO`, `VIDEO`, `FILE`, `STICKER`, `AUDIO`, `CONTROL`, ...'
          example: PHOTO
        photoId:
          type: integer
          format: int64
        photoToken:
          type: string
        videoId:
          type: integer
          format: int64
        fileId:
          type: integer
          format: int64
        audioId:
          type: integer
          format: int64
        token:
          type: string
        baseUrl:
          type: string
        url:
          type: string
        name:
          type: string
        size:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        duration:
          type: integer
        previewData:
          type: string
        event:
          type: string
        chatType:
          type: string
        title:
          type: string
        userIds:
          type: array
          items:
            type: integer
            format: int64
    MaxMessageLink:
      type: object
      description: A reply or forward link of a message
      properties:
        type:
          type: string
          example: REPLY
        chatId:
          type: integer
          format: int64
        messageId:
          type: string
        message:
          $ref: '#/components/schemas/MaxMessage'
    MaxReactionInfo:
      type: object
      properties:
        totalCount:
          type: integer
        yourReaction:
          type: string
        counters:
          type: array
          items:
            $ref: '#/components/schemas/MaxReactionCounter'
    MaxReactionCounter:
      type: object
      properties:
        reaction:
          type: string
        count:
          type: integer
    WebhookEvent:
      description: Any webhook body; `type` tells which.
      oneOf:
      - $ref: '#/components/schemas/MessageEvent'
      - $ref: '#/components/schemas/MessageEditEvent'
      - $ref: '#/components/schemas/MessageDeleteEvent'
      - $ref: '#/components/schemas/ReadReceiptEvent'
      - $ref: '#/components/schemas/ChatUpdateEvent'
      - $ref: '#/components/schemas/TypingEvent'
      - $ref: '#/components/schemas/ReactionChangeEvent'
      - $ref: '#/components/schemas/ContactUpdateEvent'
      - $ref: '#/components/schemas/PresenceUpdateEvent'
      - $ref: '#/components/schemas/DisconnectedEvent'
      - $ref: '#/components/schemas/ReconnectingEvent'
      - $ref: '#/components/schemas/ReconnectExhaustedEvent'
      - $ref: '#/components/schemas/SyncEvent'
      - $ref: '#/components/schemas/LoggedOutEvent'
      - $ref: '#/components/schemas/QRGeneratedEvent'
      - $ref: '#/components/schemas/QRScannedEvent'
      - $ref: '#/components/schemas/QRAuthorizedEvent'
      - $ref: '#/components/schemas/QRExpiredEvent'
      - $ref: '#/components/schemas/AuthExpiredEvent'
      discriminator:
        propertyName: type
        mapping:
          Message: '#/components/schemas/MessageEvent'
          MessageEdit: '#/components/schemas/MessageEditEvent'
          MessageDelete: '#/components/schemas/MessageDeleteEvent'
          ReadReceipt: '#/components/schemas/ReadReceiptEvent'
          ChatUpdate: '#/components/schemas/ChatUpdateEvent'
          Typing: '#/components/schemas/TypingEvent'
          ReactionChange: '#/components/schemas/ReactionChangeEvent'
          ContactUpdate: '#/components/schemas/ContactUpdateEvent'
          PresenceUpdate: '#/components/schemas/PresenceUpdateEvent'
          Disconnected: '#/components/schemas/DisconnectedEvent'
          Reconnecting: '#/components/schemas/ReconnectingEvent'
          ReconnectExhausted: '#/components/schemas/ReconnectExhaustedEvent'
          Sync: '#/components/schemas/SyncEvent'
          LoggedOut: '#/components/schemas/LoggedOutEvent'
          QRGenerated: '#/components/schemas/QRGeneratedEvent'
          QRScanned: '#/components/schemas/QRScannedEvent'
          QRAuthorized: '#/components/schemas/QRAuthorizedEvent'
          QRExpired: '#/components/schemas/QRExpiredEvent'
          AuthExpired: '#/components/schemas/AuthExpiredEvent'
    MessageEvent:
      type: object
      description: |-
        A new message in one of the account's chats, the account's own included.
        The media fields come from the message's attachments (the last one of a
        kind wins); `base64`, `mimeType` and `s3` only for a photo, by
        `media_delivery`.
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: Message
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        mediaType:
          type: string
          description: '`image`, `video`, `file` or `audio`'
          example: image
        mediaUrl:
          type: string
          description: A photo's URL
        base64:
          type: string
          description: A photo's bytes in base64
        mimeType:
          type: string
          description: With `base64`; `image/jpeg`
        s3:
          type: object
          description: Where the photo was uploaded to S3
          additionalProperties: true
        videoId:
          type: integer
          format: int64
        videoToken:
          type: string
        fileId:
          type: integer
          format: int64
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        audioId:
          type: integer
          format: int64
        audioUrl:
          type: string
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    MessageEditEvent:
      type: object
      description: A message was edited (MAX's message notification with status EDITED).
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: MessageEdit
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    MessageDeleteEvent:
      type: object
      description: A message was deleted (MAX's message notification with status REMOVED).
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: MessageDelete
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    ReadReceiptEvent:
      type: object
      description: Messages were read (MAX opcode 130).
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: ReadReceipt
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    ChatUpdateEvent:
      type: object
      description: A chat changed (MAX opcode 135).
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: ChatUpdate
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    TypingEvent:
      type: object
      description: Someone is typing (MAX opcode 129).
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: Typing
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    ReactionChangeEvent:
      type: object
      description: Reactions of a message changed (MAX opcode 155).
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: ReactionChange
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    ContactUpdateEvent:
      type: object
      description: A contact changed (MAX opcode 131).
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: ContactUpdate
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    PresenceUpdateEvent:
      type: object
      description: A user's presence changed (MAX opcode 132).
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: PresenceUpdate
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    DisconnectedEvent:
      type: object
      description: MAX told the session to reconnect (opcode 3). The gateway's reconnect loop takes over; `Sync` follows a successful one.
      required: [type, opcode, event, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: Disconnected
        opcode:
          $ref: '#/components/schemas/EventOpcode'
        event:
          $ref: '#/components/schemas/EventPayload'
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    ReconnectingEvent:
      type: object
      description: The session dropped and the gateway is logging in again; sent on the first attempt and every 10th.
      required: [type, attempt, max, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: Reconnecting
        attempt:
          type: integer
          description: The attempt number, from 1
          example: 1
        max:
          type: integer
          description: The attempt limit (`MAX_CONNECT_RETRIES`); 0 means none
          example: 0
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    ReconnectExhaustedEvent:
      type: object
      description: The reconnect attempts ran out (`MAX_CONNECT_RETRIES`); the session stays down until a connect. The login is kept.
      required: [type, attempts, reason, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: ReconnectExhausted
        attempts:
          type: integer
          example: 10
        reason:
          type: string
          example: max_reconnect_attempts
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    SyncEvent:
      type: object
      description: |-
        The session is logged in: after a connect with a stored login, after
        `QRAuthorized`, after a reconnect, or after `POST /session/sync`. It
        also carries every field of MAX's login answer (`profile`, `chats`,
        `contacts`, ...): the owner's chats.
      required: [type, maxUserID, reconnect, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: Sync
        maxUserID:
          $ref: '#/components/schemas/EventMaxUserID'
        reconnect:
          type: boolean
          description: true after a reconnect
        manual:
          type: boolean
          description: Present (true) only after `POST /session/sync`
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
      additionalProperties: true
    LoggedOutEvent:
      type: object
      description: |-
        MAX ended the session (opcode 20 pushed by MAX). The gateway account is
        deleted with it; its token answers 401 from now on. Not sent for
        `POST /session/logout` or `DELETE /admin/users/{userid}`.
      required: [type, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: LoggedOut
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    QRGeneratedEvent:
      type: object
      description: A QR login started, or MAX's QR expired and the gateway issued a new one (up to 10 times).
      required: [type, qrLink, qrCodeBase64, trackId, expiresAt, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: QRGenerated
        qrLink:
          type: string
          description: MAX's login link the QR encodes
        qrCodeBase64:
          type: string
          description: The same PNG data URL as `GET /session/qr`
          example: data:image/png;base64,iVBORw0KGgo...
        trackId:
          type: string
          description: MAX's id of this QR
        expiresAt:
          type: integer
          format: int64
          description: When MAX expires this QR, as MAX gives it
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    QRScannedEvent:
      type: object
      description: The owner scanned the QR (once per login).
      required: [type, trackId, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: QRScanned
        trackId:
          type: string
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    QRAuthorizedEvent:
      type: object
      description: |-
        The QR login completed and the session is up; `Sync` (with `maxUserID`)
        follows. It carries the account's MAX auth token: do not store or log it.
      required: [type, authToken, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: QRAuthorized
        authToken:
          type: string
          description: The MAX auth token of the new login (a secret)
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    QRExpiredEvent:
      type: object
      description: The QR login ended without logging in.
      required: [type, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: QRExpired
        reason:
          type: string
          description: Present when MAX refused to confirm the scanned QR (the error text); absent when the QR ran out
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    AuthExpiredEvent:
      type: object
      description: |-
        The session stopped and will not reconnect by itself: MAX refused the
        stored login with an auth error (the login is erased; a new QR login is
        needed), or refused the login 3 times in a row (the login is kept;
        `POST /session/connect` tries again).
      required: [type, reason, userID, instanceID, instanceName, eventTimestamp]
      properties:
        type:
          type: string
          const: AuthExpired
        reason:
          type: string
          description: The error text of an auth error; for refusals MAX's error code, "login timed out" or "login connection lost"
          example: login timed out
        userID:
          $ref: '#/components/schemas/EventUserID'
        instanceID:
          $ref: '#/components/schemas/EventUserID'
        instanceName:
          $ref: '#/components/schemas/EventInstanceName'
        eventTimestamp:
          $ref: '#/components/schemas/EventTimestamp'
    EventUserID:
      type: string
      description: The account id (`userID` and `instanceID` are the same)
      example: 6f1c2d4e-8b3e-4035-ba87-3f96a0e3f5c0
    EventInstanceName:
      type: string
      description: The account name; "" when the gateway could not read it
      example: Shop bot
    EventTimestamp:
      type: integer
      format: int64
      description: Unix time in seconds, set when the delivery starts; a retry keeps it
      example: 1793001234
    EventMaxUserID:
      type: integer
      format: int64
      description: The MAX id of the account's MAX user
      example: 123456789
    EventOpcode:
      type: integer
      description: MAX's opcode of the notification
      example: 128
    EventPayload:
      type: object
      description: MAX's notification payload, as MAX sent it
      additionalProperties: true
