  /chat/list:
    get:
      operationId: listChats
      summary: List the account's chats
      description: |-
        A page of the account's chats, the newest first, as the MAX web client
        pages them (CHATS_LIST, opcode 53). Each row carries the `chatId` a
        send takes and whether the account may write there. No message's text
        is in the answer unless `include=lastMessage` asks for it. The
        account's own Favorites (chat 0) is not listed.

        Pages follow MAX's cursor: pass `nextMarker` as `marker` to get the next
        page; without `nextMarker` this is the last one. MAX sets the page size
        (50 at the time of writing). `type` keeps the rows of the given kinds of
        each page, and `q` the rows whose title (a dialog's: the person's name)
        holds it, in any letter case, so a page may hold fewer rows, even none,
        while `nextMarker` is still there: page on while it is present. MAX's
        own search (opcode 68) is not used: live it found none of the
        account's chats by title. One MAX call for the page, one for the people
        behind its dialogs (their names and photos): answers within ~7 s.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      parameters:
      - name: marker
        in: query
        description: '`nextMarker` of the previous page; absent for the first page'
        schema:
          type: string
      - name: type
        in: query
        description: 'Keep only rows of these kinds: `user`, `chat`, `channel`, comma-separated or repeated'
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ChatKind'
      - name: q
        in: query
        description: Part of the title, at most 200 characters; keeps the rows of each page whose title holds it, in any letter case
        schema:
          type: string
          maxLength: 200
      - name: include
        in: query
        description: '`lastMessage` adds the last message with its text, `participants` the members'' ids; comma-separated or repeated'
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ChatInclude'
      responses:
        "200":
          description: A page of chats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatListResponse'
        "400":
          description: '`INVALID_INPUT`: an unknown `type` or `include`, a `marker` that is no `nextMarker`, or `q` over 200 characters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/PausedByCall'
        "502":
          $ref: '#/components/responses/UpstreamError'
        "503":
          $ref: '#/components/responses/NotConnected'
  /chat/info:
    get:
      operationId: chatInfo
      summary: Get chats by id
      description: |-
        The rows of up to 100 chats by id (CHAT_INFO, opcode 48), in the order
        asked, as `GET /chat/list` gives them; the chats MAX does not show the
        account are listed in `missing`. Answers within ~5.5 s.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      parameters:
      - name: chatId
        in: query
        required: true
        description: Chat ids, comma-separated or repeated, 1 to 100
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: include
        in: query
        description: As for `GET /chat/list`
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ChatInclude'
      responses:
        "200":
          description: The chats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInfoResponse'
        "400":
          description: '`INVALID_INPUT`: no `chatId`, over 100, a `chatId` that is not a non-zero integer, or an unknown `include`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/PausedByCall'
        "502":
          $ref: '#/components/responses/UpstreamError'
        "503":
          $ref: '#/components/responses/NotConnected'
  /media/photo:
    post:
      operationId: uploadPhoto
      summary: Upload a photo once
      description: |-
        Uploads a photo to MAX for the account and answers with its
        `attachment`, which `POST /chat/send/text` takes in `attachments` for
        any chat of the account. The photo comes as JSON `{url}` or `{data}`
        (base64 or a data URL), or as a multipart form with a `file` field. The
        body, and the photo, are at most `MAXAPI_PHOTO_MAX_BYTES` (10 MiB by
        default). A URL is fetched by the gateway through its SSRF guard (http
        and https only, no internal address, 8 s, a 2xx answer). The photo must
        be a JPEG, PNG, GIF or WebP image; `width` and `height` are read from
        it. Then PHOTO_UPLOAD (opcode 80) and the HTTP upload to MAX. How long
        MAX keeps an attachment is in API.md. Answers within ~27 s: the fetch at
        most 8 s, opcode 80 at most 4 s, the upload at most 15 s.
      tags:
      - media
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoBody'
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The photo is uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        "400":
          description: '`invalid_image`: the data is no JPEG, PNG, GIF or WebP image, or not base64. `INVALID_INPUT`: neither `url`, `data` nor a file, or both `url` and `data`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/PagePaused'
        "413":
          description: '`INVALID_INPUT`: the body is over `MAXAPI_PHOTO_MAX_BYTES`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          $ref: '#/components/responses/FetchFailed'
        "502":
          description: '`upload_failed`: MAX did not take the photo (it refused opcode 80 with `upstreamCode`, gave no upload address, or the upload failed); try again'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          $ref: '#/components/responses/NotConnected'
