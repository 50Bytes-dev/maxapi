  /chat/delete:
    post:
      operationId: deleteMessages
      summary: Delete messages for everyone
      description: |-
        Deletes up to 100 messages of one chat for everyone, in one MAX call,
        and answers per message. MAX answers with the ids it deleted: those are
        `deleted`, the rest `not_found`. When MAX refuses the whole call with a
        code of a message (not found, too old, no right), every id gets that
        status with `upstreamCode`. The pause applies as to a send (422
        `send_rejected`), and a stop signal pauses the account. Answers within
        ~5.5 s.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMessagesBody'
      responses:
        "200":
          description: MAX answered; the outcome of each message is in `results`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMessagesResponse'
        "400":
          description: '`invalid_target`: `chatId` is 0. `INVALID_INPUT`: the body is not JSON, or `messageIds` is empty, over 100, or has an id that is not a positive integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          description: '`send_rejected`: nothing was deleted. The account is paused (`paused`, no `upstreamCode`), MAX answered a stop signal (now paused, with `upstreamCode`), or MAX refused otherwise (`upstreamCode`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: '`send_failed`: MAX did not answer in time; the messages may be deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          $ref: '#/components/responses/NotConnected'
