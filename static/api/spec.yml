openapi: 3.1.0
info:
  title: MaxAPI
  version: 6.0.0
  description: |-
    maxapi holds logins into MAX Messenger accounts and exposes them over REST:
    the account's chats, sending text and photos (uploaded once, attached by
    token) and files, deleting for everyone, history, contacts and groups, and
    webhook events. The owner logs in by scanning a QR code in the MAX app.
    The gateway guards the account with a pause of the whole MAX account when
    MAX answers with a limit or restriction error, until the owner resumes it.
    The pause stops what the account does in MAX (sends, deletes, edits,
    reactions, uploads, phone lookups, group changes), not what it reads (the
    chat list, chat info, history, mark read, downloads, contacts, user
    info). The gateway does not pace sends: how fast an account sends is the
    job of the project that uses it.

    This schema describes maxapi 3.0.0. `API.md` in the repository is the full
    contract, with what changed in 3.0.0 and 2.0.0 and how to move to it; where the two
    disagree, the code is right. The codes, pause and chat list follow the
    contract shared with the VK gateway (vkapi).

    ## Authentication
    - **Admin endpoints** (`/admin/*`): header `Authorization` with the raw admin
      token (`MAXAPI_ADMIN_TOKEN` or `-admintoken`), without `Bearer`.
    - **Account endpoints** (`/session/*`, `/chat/*`, `/media/*`, `/user/*`,
      `/group/*`, `/webhook`): header `token` with the account token returned by
      `POST /admin/users`. A `?token=` query parameter is accepted too when the
      header is absent.
    - `/health` takes no authentication.

    A missing or unknown token answers `401` `{"success": false, "error": "unauthorized"}`
    without `code`; on an account call it means the account was deleted
    (`DELETE /admin/users/{userid}`).

    ## Errors
    Every error body is `ErrorResponse` (`success` false, `error`, and on every
    account call that reaches MAX a machine `code`). Branch on `code` and the
    HTTP status, never on `error`. `upstreamCode` is MAX's own error code,
    present whenever MAX answered with an error. While the MAX account is
    paused, a send or a delete answers `422` `send_rejected` and every other
    call that acts in MAX (edit, react, photo upload, phone lookup, group
    changes) `409` `page_paused`, both with `paused` and `pauseReason` and
    without `upstreamCode`: no MAX call was made. A call that only reads (the
    chat list, chat info, history, mark read, downloads, contacts, user info,
    presence, invite link) goes on while paused.

    ## Webhooks
    Events go to the account's webhook (see `webhooks` below) as JSON when the
    gateway runs with `WEBHOOK_FORMAT=json`, otherwise as a form
    (`application/x-www-form-urlencoded`) with the same fields and nested
    values JSON-encoded. The same body also goes to the global webhook
    (`-globalwebhook`) and to RabbitMQ (plus `serverHost`) when configured.

    ## Phone numbers
    With country code, digits only, e.g. **79001234567**. The gateway passes the
    string to MAX as given.
  license:
    name: MIT
externalDocs:
  description: maxapi on GitHub (API.md is the full contract)
  url: https://github.com/50Bytes-dev/maxapi
servers:
- description: This gateway (the one serving this schema)
  url: /
tags:
- name: admin
  description: Gateway accounts (admin token)
- name: session
  description: QR login, connection, status and pause of an account
- name: chat
  description: The account's chats, sending, editing and deleting messages, history, media downloads
- name: media
  description: Uploading a photo once for any chat of the account
- name: user
  description: MAX users and contacts
- name: group
  description: MAX group chats
- name: webhook
  description: The account's webhook URL
- name: health
  description: Liveness of the gateway
paths:
  /health:
    get:
      operationId: getHealth
      summary: Gateway health
      description: Answers 200 when the database answers a ping, 503 otherwise. MAX is not checked.
      tags:
      - health
      security: []
      responses:
        "200":
          description: The gateway and its database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        "503":
          description: The database does not answer (`success` false, `status` degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /admin/users:
    get:
      operationId: listUsers
      summary: List the accounts
      description: Every gateway account, ordered by id, with its token. Secrets of the MAX login are not shown.
      tags:
      - admin
      security:
      - AdminAuth: []
      responses:
        "200":
          description: The accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: addUser
      summary: Create an account
      description: |-
        Creates a gateway account and returns its id and account token. Nothing
        is validated. The account has no MAX login yet: `POST /session/connect`
        starts the QR login.
      tags:
      - admin
      security:
      - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserBody'
      responses:
        "200":
          description: The account is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUserResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/users/{userid}:
    parameters:
    - name: userid
      in: path
      required: true
      description: The account id from `POST /admin/users`
      schema:
        type: string
    get:
      operationId: getUser
      summary: Get an account
      description: |-
        One account with its settings. The MAX auth token is never shown, only
        whether one is stored (`auth_configured`); S3 keys are omitted and the
        proxy password is masked. The body is the account itself, without
        `success` or `data`.
      tags:
      - admin
      security:
      - AdminAuth: []
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "404":
          description: '`NOT_FOUND`: no account with this id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: '`INTERNAL_ERROR`: database error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateUser
      summary: Update an account
      description: |-
        Overwrites `name`, `webhook` and `events` with the body's values, an
        absent field with "". Succeeds for an unknown id too. The next event of
        the account already goes to the new webhook and subscription.
      tags:
      - admin
      security:
      - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserBody'
      responses:
        "200":
          description: Updated (`message` "User updated")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteUser
      summary: Delete an account
      description: |-
        Stops the account's QR login and MAX session for good and deletes the
        account with its MAX login and phone lookup cache: once the call
        returns, the account's WebSockets to MAX are closed and nothing of it
        (a ping, a poll, a reconnect) reaches MAX. Succeeds for an unknown id
        too. No webhook
        is sent, and the session is not logged out in MAX (`POST /session/logout`
        does that). A pause of its MAX account stays. The account's token
        answers `401` from then on.
      tags:
      - admin
      security:
      - AdminAuth: []
      responses:
        "200":
          description: The account is deleted (`message` "User deleted")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          $ref: '#/components/responses/AdminUnauthorized'
        "500":
          description: Database error (no `code`); the account stays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/connect:
    post:
      operationId: connect
      summary: Connect the account to MAX
      description: |-
        Overwrites the event subscription, then: without a stored MAX login,
        starts a QR login (`details` "Awaiting QR scan", webhook `QRGenerated`;
        read the QR from `GET /session/qr`); with a stored login and no session,
        logs in with it (`details` "Connected to MAX", webhook `Sync`); with the
        session already up, changes nothing else (`alreadyConnected` true and the
        account's pause). The MAX account id is not in this answer: read it from
        `GET /session/status` or the `Sync` event.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectBody'
      responses:
        "200":
          description: A QR login started, the stored login is being used, or the session was already up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: |-
            No `code`. A database error; or, with `immediate` false, the session
            was not up after 5 s ("failed to connect"; the login goes on in the
            background).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: |-
            The QR login could not start; no login runs. `not_connected`: MAX
            could not be reached. `login_unavailable`: MAX refused to issue a QR
            (`upstreamCode`). Connect again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/qr:
    get:
      operationId: getQr
      summary: Get the QR of the running login
      description: |-
        The QR of the running QR login as a PNG data URL. The gateway issues a
        new QR when MAX's expires (up to 10 times) or after it connected to MAX
        again (webhook `QRGenerated`); the webhooks alone can drive the login
        screen. No MAX call.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: The login waits for the scan, or confirms it (`scanned` true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: |-
            `password_required`: MAX asks for the account's cloud password
            (webhook `QRPasswordRequired`); there is no QR any more, send the
            password with `POST /session/password`. `already_logged_in`: no
            login runs and a MAX login is stored; read `GET /session/status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "410":
          description: |-
            No login runs: the outcome of the last one, kept until the next
            connect, a disconnect, a logout or a restart. `login_expired`: MAX
            expired the QR after 10 new ones, the password was not entered in
            10 minutes or MAX refused it too often, or no login was started.
            `login_failed`: MAX refused the login, did not answer it, or could
            not be reached again after the connection dropped.
            `login_unsupported`: MAX asked for a step the gateway does not
            support (`QRExpired` names it in `step`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/password:
    post:
      operationId: submitPassword
      summary: Send the account's cloud password
      description: |-
        After the scan MAX asks for the cloud password of an account that has
        one (webhook `QRPasswordRequired`, `GET /session/qr` answers `409
        password_required`). This passes it to MAX (opcode 115). `200` means
        MAX took it: `QRAuthorized` and `Sync` follow. A wrong password
        answers `422 invalid_password` and may be sent again; the fifth
        refusal ends the login (`410 login_expired`). The password is never
        stored or logged.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordBody'
      responses:
        "200":
          description: MAX took the password; the session is being brought up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResponse'
        "400":
          description: '`INVALID_INPUT`: the body is not JSON, or the password is empty or over 256 bytes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: |-
            `password_not_required`: a login runs, but MAX has not asked for a
            password. `already_logged_in`: no login runs and a MAX login is
            stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "410":
          description: |-
            The login has ended: `login_expired` (also when MAX refused the
            fifth password or ended the password step), `login_failed`,
            `login_unsupported`, as in `GET /session/qr`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: '`invalid_password`: MAX refused the password (`upstreamCode`, e.g. `password2fa.wrong`); send it again'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: '`not_connected`: MAX did not answer in time; send the password again'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/disconnect:
    post:
      operationId: disconnect
      summary: Disconnect the account
      description: |-
        Stops the running QR login (no `QRExpired`; once the call returns,
        nothing of the login reaches MAX), or closes the MAX session and stops
        its reconnects. The stored MAX login stays: the next connect reuses it.
        The session is not logged out in MAX, and no webhook is sent. No body
        is read.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: Disconnected (`message` "Disconnected")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/AccountLookupError'
  /session/logout:
    post:
      operationId: logout
      summary: Log out of MAX
      description: |-
        Stops a running QR login, ends the MAX session (opcode 20) and erases
        the stored MAX login. The
        gateway account stays, with its token, webhook and settings: a new
        login is a QR login through `POST /session/connect`. Deleting the
        account is `DELETE /admin/users/{userid}`. No webhook is sent.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: Logged out (`message` "Logged out")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/AccountLookupError'
  /session/status:
    get:
      operationId: getStatus
      summary: Get the account's MAX session
      description: |-
        Reports the session, the stored login, the MAX account's name and photo
        (the live session's, else the last login's) and the pause of the MAX
        account. No MAX call. Read `paused` before `connected`: a paused account
        keeps its session.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: The account's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/AccountLookupError'
  /session/resume:
    post:
      operationId: resume
      summary: Resume sending from the account
      description: |-
        Lifts the pause of the MAX account this account is logged into (the
        live session's, or the one stored at the last login), for every gateway
        account logged into it; `maxUserID` names the MAX account. An account
        that is not paused, or whose MAX account is unknown, answers the same.
        Every gateway account of the MAX account subscribed to `Resumed` (or
        `All`) gets that event. The body is optional. No MAX call.
      tags:
      - session
      security:
      - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeBody'
      responses:
        "200":
          description: The MAX account is not paused any more
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeResponse'
        "400":
          description: '`INVALID_INPUT`: the body is not JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: '`INTERNAL_ERROR`: database error; the account stays paused. Also a database error while reading the account (no `code`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhook:
    get:
      operationId: getWebhook
      summary: Get the webhook URL
      description: The account's webhook URL as the gateway currently uses it.
      tags:
      - webhook
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: The webhook URL ("" when none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/AccountLookupError'
    post:
      operationId: setWebhook
      summary: Set the webhook URL
      description: Stores the URL the account's events go to; "" sends none.
      tags:
      - webhook
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookBody'
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateWebhook
      summary: Set the webhook URL (the same as POST)
      description: The same as `POST /webhook`.
      tags:
      - webhook
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookBody'
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "400":
          description: The body is missing or not JSON (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteWebhook
      summary: Remove the webhook URL
      description: Sets the webhook URL to ""; no events are sent from now on.
      tags:
      - webhook
      security:
      - ApiKeyAuth: []
      responses:
        "200":
          description: Removed (`message` "Webhook deleted")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: Database error (no `code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /chat/send/text:
    post:
      operationId: sendText
      summary: Send a message
      description: |-
        Sends a text, with up to 12 photos uploaded by `POST /media/photo`, to a
        chat (a dialog, a group chat, a channel the account may post in) or to a
        person by phone. Every error carries a delivery outcome `code`: only
        `send_failed` (500) means the message may have arrived; every other
        error means nothing was sent. The checks run in this order: session,
        body, target, message, pause, lookup (cache, then MAX), send.
        Answers within ~9.5 s: the phone lookup waits at most 4 s for MAX, the
        send at most 5 s, each database call at most 200 ms.

        The gateway does not pace sends: each send goes to MAX at once, and
        sends of one account may run at the same time. How fast an account
        sends is the job of the project that uses the gateway.

        A MAX error on the lookup or the send whose code marks a limit or
        restriction (`restricted`, `too.many`, `flood`, `spam`, or `limit` other
        than a size or length limit) pauses the MAX account (`paused`,
        `pauseReason`) and sends `Paused`; while paused every send of every
        gateway account of it answers 422 `send_rejected` without a MAX call,
        until `POST /session/resume`.

        With a `ref`, a send answered `send_failed` is confirmed later by the
        `MessageOutcome` event.
      tags:
      - chat
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTextBody'
      responses:
        "200":
          description: MAX accepted the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTextResponse'
        "400":
          description: 'Not sent. `invalid_target`: neither `chatId` nor `phone`. `INVALID_INPUT`: the body is not JSON, an attachment is empty, or `ref` is over 128 bytes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: '`address_refused`: not sent. The chat does not let the account write (MAX''s `chat.denied`, `channel.denied`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: |-
            `address_not_found`: not sent. `phone` is malformed, MAX has no user
            with it, the lookup cache holds MAX's `not.found` younger than 30
            days, or MAX knows no such chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: |-
            Not sent. `message_rejected`: the message itself is refused, without
            a MAX call (no text and no attachment, a text over 4000 UTF-16 units,
            over 12 attachments) or by MAX (`upstreamCode`); it will not go to
            this chat as it is. `attachment_rejected`: MAX refused an attachment
            (expired, wrong or deleted); upload the photo again.
            `send_rejected`: the account is paused (`paused`, no
            `upstreamCode`), MAX answered a stop signal (now paused, with
            `upstreamCode`), or MAX refused otherwise (`upstreamCode`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: |-
            `send_failed`: the outcome is unknown, MAX may have delivered the
            message (no answer in time, or the session was lost after the send
            went out); never resend it automatically. With a `ref`,
            `MessageOutcome` tells later whether it arrived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: |-
            Not sent. `not_connected`: no live MAX session. `lookup_failed`: the
            phone lookup timed out, lost its connection or MAX answered it with
            an error other than `not.found` (`upstreamCode`; a stop signal also
            pauses the account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /chat/send/audio:
    post:
      operationId: sendAudio
      summary: Send an audio file
      description: |-
        Sends an audio file, sent as a file: the media is fetched or decoded (a URL goes through the
